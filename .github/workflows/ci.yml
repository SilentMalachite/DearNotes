name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      # 画面のない Linux では UI テストは自動で飛ぶ。xvfb で動かす
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew test
      - if: runner.os != 'Linux'
        run: ./gradlew test
